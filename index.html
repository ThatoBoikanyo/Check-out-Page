<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Checkout Page</title>
</head>

<body>

    <h1>Checkout</h1>
    
    <section>
        
        <h2>Your Cart</h2>
        <img src="https://cdn.freecodecamp.org/curriculum/labs/cube.jpg">
    
    </section>
    <section>

        <h2>Payment Information</h2>
        <form>
            <label for="card-name">Card Name<span aria-hidden="true">*</span></label>
            <input required type="text" id="card-name" name="card-name">

            <label for="card-number">Card Number<span aria-hidden="true">*</span></label>
            <input required type="text" id="card-number" name="card-number">

            <p id="card-number-help">Enter your 16 digit card number without spaces</p>

        </form>


    </section>

</body>

</html>
